server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # Проксируем API на бэкенд — фронт и API на одном origin (без CORS)
    location /api/ {
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend:8020/health;
        proxy_set_header Host $host;
    }
}
