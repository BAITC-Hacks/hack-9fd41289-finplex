# Запуск всего проекта одной командой:  docker compose up --build
# Дашборд: http://localhost:3100   API: http://localhost:8020
services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      LLM_ENABLED: "${LLM_ENABLED:-true}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}"
    volumes:
      - ./data:/data:ro          # данные партнёра монтируем только на чтение
    ports:
      - "8020:8020"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
